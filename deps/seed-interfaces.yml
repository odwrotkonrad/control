repos:
  configs:
    upstream:
      - go-modules/che
      - infra/oci-images/ci-linux
    edges:
      configs/gitlab/projects: [repo-index]
      configs/purpose-doc: [repo-index]
      go-modules/purpose-doc: [repo-index]
      go-modules/che: [repo-index]
      infra/iac/purpose-doc: [repo-index]
      infra/oci-images/purpose-doc: [repo-index]
      infra/sandbox/purpose-doc: [repo-index]
      notes/purpose-doc: [repo-index]
      resume-md-pdf/purpose-doc: [repo-index]
    downstream:
      - {name: zsh/base-linux, type: che-profile}
      - {name: llm/claude, type: ai-prose}
      - {name: gitlab/projects, type: che-profile}
      - {name: purpose-doc, type: ai-prose}
      - {name: repo-index, type: ai-prose}
  go-modules:
    upstream:
      - configs/llm/claude
      - infra/oci-images/ci-linux
      - infra/oci-images/ci-linux-dind
    edges:
      go-modules/lib: [che, get-os-open-files-with, get-term-open-files-with]
    downstream:
      - {name: che, type: binary}
      - {name: get-os-open-files-with, type: binary}
      - {name: get-term-open-files-with, type: binary}
      - {name: lib, type: go-module}
      - {name: purpose-doc, type: ai-prose}
  infra/iac:
    upstream:
      - configs/llm/claude
      - infra/oci-images/ci-linux
    downstream:
      - {name: tf-lock, type: lockfile}
      - {name: purpose-doc, type: ai-prose}
      - {name: ci-var/artifact-registry, type: ci-variable}
      - {name: ci-var/ci-images-ref, type: ci-variable}
      - {name: ci-var/che-packages-ref, type: ci-variable}
      - {name: ci-var/che-backup-auto-create, type: ci-variable}
      - {name: ci-var/enable-darwin-ci, type: ci-variable}
  infra/oci-images:
    upstream:
      - configs/llm/claude
      - infra/iac/tf-lock
      - infra/oci-images/ci-linux
    edges:
      go-modules/che: [ci-linux, dev-sandbox]
      configs/zsh/base-linux: [dev-sandbox]
    downstream:
      - {name: ci-linux, type: oci-image}
      - {name: ci-linux-dind, type: oci-image}
      - {name: dev-sandbox, type: oci-image}
      - {name: purpose-doc, type: ai-prose}
  infra/sandbox:
    upstream:
      - configs/llm/claude
      - infra/oci-images/ci-linux
    edges:
      configs/llm/claude: [sandbox]
      go-modules/che: [sandbox]
      configs/zsh/base-linux: [sandbox]
    downstream:
      - {name: sandbox, type: oci-image}
      - {name: purpose-doc, type: ai-prose}
  notes:
    upstream:
      - configs/llm/claude
      - infra/oci-images/ci-linux
    downstream:
      - {name: purpose-doc, type: ai-prose}
  resume-md-pdf:
    upstream:
      - infra/oci-images/ci-linux
    downstream:
      - {name: styled-resume-pdf, type: pdf}
      - {name: purpose-doc, type: ai-prose}
##[<] 🤖🤖
