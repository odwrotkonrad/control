repositories:
  - repo: ai-sandbox
    artifacts:
      - {name: sandbox, type: oci-image}
  - repo: configs
    artifacts: []
  - repo: cross-repo/automation
    artifacts: []
  - repo: cross-repo/infra/iac
    artifacts:
      - {name: ci-var/artifact-registry, type: ci-variable}
      - {name: ci-var/prose-assets-ref, type: ci-variable}
      - {name: ci-var/ci-images-ref, type: ci-variable}
  - repo: cross-repo/infra/oci-images
    artifacts:
      - {name: ci-linux, type: oci-image}
  - repo: cross-repo/prose/assets
    artifacts:
      - {name: repo-prose, type: ai-prose}
      - {name: license, type: ai-prose}
  - repo: go-modules
    artifacts:
      - {name: che, type: binary}
edges:
  cross-repo/infra/iac/ci-var/ci-images-ref:
    - configs
    - go-modules
  cross-repo/infra/oci-images/ci-linux:
    - configs
    - cross-repo/infra/iac
    - cross-repo/infra/iac/ci-var/ci-images-ref
    - cross-repo/infra/oci-images
  cross-repo/prose/assets/license:
    - configs
    - cross-repo/infra/iac/ci-var/prose-assets-ref
  cross-repo/prose/assets/repo-prose:
    - ai-sandbox/sandbox
    - cross-repo/automation
    - cross-repo/infra/iac/ci-var/prose-assets-ref
  go-modules/che:
    - ai-sandbox/sandbox
    - cross-repo/infra/oci-images/ci-linux
