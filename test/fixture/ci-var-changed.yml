stages: [regen]
variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  CI_IMAGES_REF: $GRP_KO_VAR_CI_IMAGES_REF
regen:ai-sandbox:
  stage: regen
  image: $ARTIFACT_REGISTRY/ci-linux:$CI_IMAGES_REF
  tags:
    - gke-linux-amd64-small
  variables:
    CONTROL_GITLAB_TOKEN: $REPO_VAR_CONTROL_GITLAB_TOKEN
  script:
    - scripts/regen/regen.zsh --repo ai-sandbox --tag v0.0.45 --producer prose-assets --prev v0.0.44
regen:configs:
  stage: regen
  image: $ARTIFACT_REGISTRY/ci-linux:$CI_IMAGES_REF
  tags:
    - gke-linux-amd64-small
  variables:
    CONTROL_GITLAB_TOKEN: $REPO_VAR_CONTROL_GITLAB_TOKEN
  script:
    - scripts/regen/regen.zsh --repo configs --tag v0.0.45 --producer prose-assets --prev v0.0.44
regen:cross-repo/automation:
  stage: regen
  image: $ARTIFACT_REGISTRY/ci-linux:$CI_IMAGES_REF
  tags:
    - gke-linux-amd64-small
  variables:
    CONTROL_GITLAB_TOKEN: $REPO_VAR_CONTROL_GITLAB_TOKEN
  script:
    - scripts/regen/regen.zsh --repo cross-repo/automation --tag v0.0.45 --producer prose-assets --prev v0.0.44
