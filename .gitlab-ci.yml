workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - verify
  - regen

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. gke-linux-amd64 resolves to the medium
#   size, matching the SaaS runner it replaces
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest

validate-pre-commit-all:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

validate-deps-graph:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success
  script:
    - make aggregate-check

verify-prose-release:
  stage: verify
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  script:
    - scripts/aggregate/aggregate.zsh --out deps/deps-graph.yml
    - scripts/verify/verify.zsh --emit-pipeline regen-pipeline.yml
  artifacts:
    paths:
      - regen-pipeline.yml

regen-fan-out:
  stage: regen
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  needs:
    - verify-prose-release
  trigger:
    include:
      - artifact: regen-pipeline.yml
        job: verify-prose-release
    strategy: depend
